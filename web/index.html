<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D2B55" />
    <!-- Base SEO — overridden per-page by MetaTags component via react-helmet-async -->
    <title>Sudačka Mreža — Portal za sudsku praksu u Hrvatskoj</title>
    <meta name="description" content="Sudačka Mreža je portal za sudsku praksu, sudske vještake, tumače i pravne informacije u Republici Hrvatskoj." />
    <meta name="robots" content="index, follow" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sudačka Mreža" />
    <meta property="og:title" content="Sudačka Mreža — Portal za sudsku praksu u Hrvatskoj" />
    <meta property="og:description" content="Sudačka Mreža je portal za sudsku praksu, sudske vještake, tumače i pravne informacije u Republici Hrvatskoj." />
    <meta property="og:image" content="https://sudacka-mreza.hr/assets/sudacka-mreza-logo.gif" />
    <meta property="og:locale" content="hr_HR" />
    <meta property="og:url" content="https://sudacka-mreza.hr/hr" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sudačka Mreža — Portal za sudsku praksu u Hrvatskoj" />
    <meta name="twitter:description" content="Sudačka Mreža je portal za sudsku praksu, sudske vještake, tumače i pravne informacije u Republici Hrvatskoj." />
    <meta name="twitter:image" content="https://sudacka-mreza.hr/assets/sudacka-mreza-logo.gif" />
    <!-- Sitemap / alternate -->
    <link rel="alternate" type="application/rss+xml" title="Sudska praksa — RSS" href="https://sudacka-mreza.hr/api/rss/court-decisions.xml" />
    <!-- Flash Of Wrong Theme prevention — must run before CSS -->
    <script>
      (function(){
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches))
          document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
