add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Deny powerful APIs we don't use. Add to allowlist if a future feature
# legitimately needs camera/microphone/geolocation/etc.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# Self-hosted fonts now (see web/src/styles/globals.css), so no external
# font hosts in style-src / font-src. Map tiles + Nominatim + HIBP are the
# only legitimate cross-origin endpoints.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org https://api.haveibeenpwned.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
# HSTS — only meaningful once HTTPS is live. Uncomment after certbot:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
