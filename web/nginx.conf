# ── Rate limiting zones ──────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_search:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Hide nginx version
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Block source maps in production ──────────────────────────────────
    location ~* \.map$ {
        return 404;
    }

    # ── Defense-in-depth: block secret-file paths even at the docker layer
    # (the host nginx already returns 404 for these; this hardens the
    # container in case it's ever exposed directly).
    location ~ /\.(git|svn|hg|env|bzr|DS_Store|htaccess|htpasswd) { deny all; return 404; }
    location ~ \.(log|sql|bak|backup|old|orig|swp|zip|tar|tar\.gz|tgz)$ { deny all; return 404; }
    location = /package.json { deny all; return 404; }
    location = /package-lock.json { deny all; return 404; }
    location = /pnpm-lock.yaml { deny all; return 404; }
    location = /yarn.lock { deny all; return 404; }
    location = /tsconfig.json { deny all; return 404; }
    location = /vite.config.ts { deny all; return 404; }
    location = /config.json { deny all; return 404; }
    location = /web.config { deny all; return 404; }

    # index.html must never be cached
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Hashed assets — cache forever, immutable
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Auth API endpoints — strict rate limit (5 req/min) ───────────────
    location ~ ^/api/users/(login|forgot-password|reset-password) {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://cms:4094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── User registration — rate limit (5 req/min) ──────────────────────
    location = /api/users {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://cms:4094/api/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Search endpoints — moderate rate limit ───────────────────────────
    location ~ ^/api/(search|decisions/search|decisions/hybrid-search) {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_search burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://cms:4094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── General API — rate limit ─────────────────────────────────────────
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://cms:4094/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NLP API proxy
    location /api/nlp/ {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_general burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://172.17.0.1:8026/api/nlp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Translation API proxy
    location /api/translate {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_general burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://172.17.0.1:8026/api/nlp/translate;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # SPA fallback — all routes to index.html
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
