<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="4" fill="#0D2B55"/>
  <!-- Balance beam -->
  <line x1="8" y1="10" x2="24" y2="10" stroke="#C8941A" stroke-width="2" stroke-linecap="round"/>
  <!-- Center post -->
  <line x1="16" y1="10" x2="16" y2="24" stroke="#C8941A" stroke-width="2" stroke-linecap="round"/>
  <!-- Left pan strings -->
  <line x1="10" y1="10" x2="9" y2="16" stroke="#C8941A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="11" y2="16" stroke="#C8941A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right pan strings -->
  <line x1="22" y1="10" x2="21" y2="16" stroke="#C8941A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="10" x2="23" y2="16" stroke="#C8941A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M7 16 Q10 18 13 16" stroke="#C8941A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M19 16 Q22 18 25 16" stroke="#C8941A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="12" y1="24" x2="20" y2="24" stroke="#C8941A" stroke-width="2" stroke-linecap="round"/>
</svg>
