server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Editor ingest service — routes /api/editor/* to the bankruptcy-ingest FastAPI
    # app. Note: editor endpoints live under /editor on that service, so we strip
    # /api here. Keep this block BEFORE the generic /api/ block so it wins.
    location /api/editor/ {
        proxy_pass http://bankruptcy-ingest:8080/editor/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~* \.map$ {
        return 404;
    }

    # Defense-in-depth: block secret-file paths at the container layer too,
    # so a misconfigured front nginx or direct container exposure can't leak
    # them. The host nginx also denies these; this is intentional duplication.
    location ~ /\.(git|svn|hg|env|bzr|DS_Store|htaccess|htpasswd) { deny all; return 404; }
    location ~ \.(log|sql|bak|backup|old|orig|swp|zip|tar|tar\.gz|tgz)$ { deny all; return 404; }
    location = /package.json { deny all; return 404; }
    location = /package-lock.json { deny all; return 404; }
    location = /pnpm-lock.yaml { deny all; return 404; }
    location = /yarn.lock { deny all; return 404; }
    location = /tsconfig.json { deny all; return 404; }
    location = /vite.config.ts { deny all; return 404; }
    location = /config.json { deny all; return 404; }
    location = /web.config { deny all; return 404; }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Chat endpoint — LLM inference takes 30–120s for RAG-heavy queries, so
    # override nginx default (60s) with a 180s window. Keep this block BEFORE
    # the generic /api/ block.
    location /api/chat {
        proxy_pass http://cms:4094/api/chat;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        proxy_pass http://cms:4094/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
