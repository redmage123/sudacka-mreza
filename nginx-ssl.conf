# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_search:10m rate=10r/s;

server {
    listen 80;
    server_name sudacka-mreza.hr www.sudacka-mreza.hr _;

    server_tokens off;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS (once cert is in place)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sudacka-mreza.hr www.sudacka-mreza.hr _;

    server_tokens off;

    # SSL — certbot will manage these files
    ssl_certificate /etc/letsencrypt/live/sudacka-mreza.hr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sudacka-mreza.hr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    include /etc/nginx/conf.d/security-headers.conf;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Block source maps
    location ~* \.map$ {
        return 404;
    }

    # index.html — never cache
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Hashed assets — cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Auth API — strict rate limit
    location ~ ^/api/users/(login|forgot-password|reset-password) {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://cms:4094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Registration — rate limited
    location = /api/users {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://cms:4094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Search — moderate rate limit
    location ~ ^/api/(search|decisions/search|decisions/hybrid-search) {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_search burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://cms:4094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://cms:4094/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
