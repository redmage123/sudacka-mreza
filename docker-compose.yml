services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sudacka_mreza}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sudacka_mreza}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cms:
    build: ./cms
    # SECURITY: bind to 127.0.0.1 only — CMS must not be directly accessible
    # from the public internet. All public access goes through the web container's
    # nginx reverse proxy (/api/) or through Caddy in production.
    ports:
      - "127.0.0.1:4093:4094"
    # Allow the CMS container to reach services on the Docker host (e.g. RAG API on :8020)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sudacka_mreza}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret-change-in-prod-min-32-chars!!}
      PORT: 4094
      SERVER_URL: ${SERVER_URL:-http://78.47.104.139:4093}
      FRONTEND_URL: ${FRONTEND_URL:-http://78.47.104.139:4092}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-info@sudacka-mreza.hr}
      JURISDICTION_GEOJSON_PATH: ${JURISDICTION_GEOJSON_PATH:-}
      PAYLOAD_MIGRATIONS_DIR: dist/migrations
      # RAG API for semantic search ingestion and hybrid-search endpoint.
      # Uses host.docker.internal so the container can reach the RAG service
      # running on the Docker host at port 8020.
      RAG_URL: ${RAG_URL:-http://host.docker.internal:8020}
      RAG_API_KEY: ${RAG_API_KEY:-rag_ak_aielevate_2026_secret}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 600m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4094 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        VITE_CMS_URL: ${VITE_CMS_URL:-http://78.47.104.139:4093}
    ports:
      - "4092:80"
    depends_on:
      cms:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  # E2E test runner — activated with: docker compose --profile test run --rm e2e
  # Or use scripts/deploy.sh which runs it automatically after every deploy.
  e2e:
    image: python:3.12-slim
    profiles: ["test"]
    network_mode: host
    environment:
      BASE_URL: ${BASE_URL:-http://78.47.104.139:4092}
    volumes:
      - ./tests/e2e:/tests/e2e:ro
    working_dir: /tests/e2e
    command: >
      bash -c "
        pip install pytest playwright --quiet &&
        playwright install chromium --with-deps --quiet &&
        python3 -m pytest . -v --tb=short
      "
    depends_on:
      cms:
        condition: service_healthy

volumes:
  postgres_data:
